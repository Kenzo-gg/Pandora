{% load pandora_nav %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}PANDORA · Sales and inventory{% endblock %}</title>
<script>
(() => {
  const root = document.documentElement;
  const system = matchMedia('(prefers-color-scheme: dark)');
  const key = 'pandora-theme';
  let preference;
  try { preference = localStorage.getItem(key); } catch {}
  function applyTheme() {
    const dark = preference === 'dark' || (preference !== 'light' && system.matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    const toggle = document.querySelector('.theme-toggle');
    if (toggle) toggle.setAttribute('aria-pressed', String(dark));
  }
  applyTheme();
  system.addEventListener('change', applyTheme);
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) {
      preference = event.newValue;
      applyTheme();
    }
  });
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    document.querySelector('.theme-toggle')?.addEventListener('click', () => {
      preference = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, preference); } catch {}
      applyTheme();
    });
  });
})();
</script>
<style>{% include "pandoraapp/theme.css" %}{% include "pandoraapp/motion.css" %}</style></head>
<body>{% include "pandoraapp/icon_defs.html" %}{% block body %}{% endblock %}<div class="toasts" aria-live="polite">{% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}<button type="button" aria-label="Dismiss notification">×</button></div>{% endfor %}</div>
<script>{% include "pandoraapp/motion.js" %}</script></body></html>
