{% extends 'pandoraapp/document.html' %}
{% block title %}Sign in · PANDORA{% endblock %}
{% block body %}
<main class="signin">
  <section>
    <div class="signin-head"><div class="brand"><b aria-hidden="true">{% include "pandoraapp/icon.html" with name="brand" only %}</b> PANDORA</div>{% include "pandoraapp/theme_toggle.html" %}</div>
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button>Sign in</button>
    </form>
  </section>
</main>
{% endblock %}
