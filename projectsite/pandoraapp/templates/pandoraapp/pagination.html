{% if page.has_other_pages %}
<div aria-label="Pagination">
  {% if page.has_previous %}<a href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}{% if start %}&amp;start={{ start|date:'Y-m-d' }}{% endif %}{% if end %}&amp;end={{ end|date:'Y-m-d' }}{% endif %}{% if supplier %}&amp;supplier={{ supplier.pk }}{% endif %}&amp;page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}{% if start %}&amp;start={{ start|date:'Y-m-d' }}{% endif %}{% if end %}&amp;end={{ end|date:'Y-m-d' }}{% endif %}{% if supplier %}&amp;supplier={{ supplier.pk }}{% endif %}&amp;page={{ page.next_page_number }}">Next</a>{% endif %}
</div>
{% endif %}
